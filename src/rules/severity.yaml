# ArogyaAI severity map: disease -> baseline triage tier
# Default is ROUTINE; diseases with serious potential complications are URGENT;
# acute life-threatening presentations are EMERGENCY.
# Keys are copied VERBATIM from data_manifest.json's class_counts, including
# upstream dataset typos/casing/parenthetical suffixes -- do not "clean" these
# spellings, the engine's lookup is an exact string match. See task.md Phase 4
# alignment note: task.md's own severity.yaml example uses cleaned spellings
# for 5 of these (Peptic ulcer disease/Hepatitis A/Dimorphic hemorrhoids/
# Osteoarthritis/Paroymsal Positional Vertigo) that don't match the real data.

